{% extends 'base.html' %}{% block body %}<div class="grid archive-layout"><section class="panel"><div class="panel-head"><h2>核算记录</h2><span>{{history|length}} 批</span></div>{{ledger(history,[('id','运行批次'),('created','UTC生成时间'),('version','版本'),('reviewed','复核')])}}</section><section class="panel"><div class="panel-head"><h2>复核签发</h2><span>v{{bundle.version}}</span></div><div class="panel-body"><label class="digest-label">输入 SHA256<code class="digest">{{bundle.manifest.sha256}}</code></label><dl><dt>规则</dt><dd>{{bundle.manifest.rule_version}}</dd><dt>核算耗时</dt><dd>{{bundle.manifest.elapsed_ms}} ms</dd></dl><button class="btn primary" id="review" data-run="{{bundle.manifest.run_id}}" data-version="{{bundle.version}}">确认复核</button></div></section></div>{% endblock %}
