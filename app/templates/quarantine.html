{% extends 'base.html' %}{% block body %}<div class="grid quarantine-layout"><section class="panel"><div class="panel-head"><h2>拒收标本</h2><a class="btn" href="/api/quarantine/export">导出证据</a></div>{{ledger(bundle.quarantine.rows,[('line','来源行'),('code','原因码'),('reason','原因'),('raw','原始记录')])}}</section><section class="panel"><div class="panel-head"><h2>原因统计</h2><span>{{bundle.quarantine.total}} 条</span></div><div class="panel-body">{% for code,n in bundle.quarantine.counts.items() %}<div class="reason-row"><code>{{code}}</code><b>{{n}}</b></div>{% endfor %}</div></section></div>{% endblock %}
